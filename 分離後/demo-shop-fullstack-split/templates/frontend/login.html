<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入｜海螺小舖</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <h1>🐚 <a href="index.html" id="site-name">海螺小舖</a></h1>
  </header>

  <main class="auth-layout">
    <form id="login-form" class="panel" autocomplete="on">
      <h2>會員登入</h2>
      <label>帳號 <input id="login-username" name="username" required autocomplete="username" /></label>
      <label>密碼 <input id="login-password" name="current-password" type="password" required autocomplete="current-password" /></label>
      <p id="login-error" class="error" aria-live="polite"></p>
      <button class="primary" type="submit" id="login-submit">登入</button>
      <p class="muted small">測試帳號：amy / amy2025（VIP）、bob / bob12345、admin / admin123、staff / staff2025</p>
    </form>

    <form id="register-form" class="panel" autocomplete="on">
      <h2>註冊新會員</h2>
      <label>帳號 <input id="reg-username" name="username" required autocomplete="username" /></label>
      <label>密碼 <input id="reg-password" name="new-password" type="password" required autocomplete="new-password" /></label>
      <label>姓名 <input id="reg-name" name="name" required /></label>
      <label>Email <input id="reg-email" name="email" type="email" autocomplete="email" /></label>
      <label>手機 <input id="reg-phone" name="tel" autocomplete="tel" /></label>
      <p id="register-error" class="error" aria-live="polite"></p>
      <button class="primary" type="submit" id="register-submit">註冊</button>
    </form>
  </main>

  <!-- 移除舊版：js/config.js、js/data/*.js、js/db.js、js/auth.js、js/login.js -->
  <!-- 新版：以 SDK + 頁面腳本對接後端 API（先載 ApiClient，再載 AuthClient，最後載入頁面邏輯） -->
  <script src="sdk/apiClient.js"></script>
  <script src="sdk/authClient.js"></script>
  <script src="pages/login.js"></script>
</body>
</html>
